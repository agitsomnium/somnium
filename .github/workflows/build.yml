name: 시트에서 홈페이지 만들기

on:
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *'
  push:
    branches: [main]
    paths: ['scripts/**', 'assets/**', 'content/**', 'config/**', '.github/workflows/build.yml', 'tests/**']

permissions:
  contents: write

concurrency:
  group: somnium-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 운영 흐름 시험
        run: python3 -m unittest discover -s tests -v
      - name: 공개 CSV 내려받고 검증
        run: |
          if python3 -c "import json,sys; d=json.load(open('config/sheets.json')); sys.exit(0 if any(d.values()) else 1)"; then
            python3 scripts/fetch_sheets.py
          else
            echo "시트 주소가 아직 없어 연습 자료(data/sample)로 만듭니다"
            mkdir -p data/live && cp data/sample/*.csv data/live/
          fi
      - name: 유튜브 최근 영상 목록 받기
        run: python3 scripts/fetch_youtube.py data/live
      - name: 인스타 최신 글 받기
        run: python3 scripts/fetch_social.py data/live
      - name: 60일 멈춤 방지(오래 조용하면 표시 파일 갱신)
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt 3888000 ]; then
            mkdir -p data/catalog && date -u +%F > data/catalog/keepalive.txt
          fi
      - name: 새 영상을 누적 목록에 저장
        if: github.event_name != 'pull_request'
        run: |
          if [ -n "$(git status --porcelain data/catalog)" ]; then
            git config user.name "somnium-bot"
            git config user.email "agit.somnium@gmail.com"
            git add data/catalog
            git commit -m "유튜브 새 영상·인스타 글 목록 저장 [skip ci]"
            git push || echo "목록 저장 push 실패 — 다음 실행 때 다시 시도"
          fi
      - name: 실제 시트로 정적 HTML 생성
        env:
          SITE_BASE_PATH: ${{ vars.SITE_BASE_PATH }}
        run: python3 scripts/build.py --data data/live
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 승인된 홈페이지 공개
        id: deployment
        uses: actions/deploy-pages@v4
