:root{--ink:#203b5e;--accent:#bd6d2c;--muted:#647384;--paper:#fffdfa;--line:#deded6}*{box-sizing:border-box}body{margin:0;background:#f0ede6;color:#25313e;font:16px/1.75 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}main{max-width:980px;margin:24px auto;background:var(--paper);padding:clamp(20px,5vw,60px)}h1,h2,h3{color:var(--ink);line-height:1.4}h1{font-size:clamp(28px,5vw,46px);margin:.4em 0}h2{font-size:25px;border-top:2px solid var(--ink);padding-top:18px;margin-top:42px}h3{font-size:18px}.eyebrow{color:var(--accent);font-weight:700;letter-spacing:.05em}.lead,.caption{color:var(--muted)}.caption{font-size:13px}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 0;border-block:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:2}button,select{font:inherit;background:#fff;border:1px solid #b7b8b5;border-radius:5px;padding:7px 12px;color:var(--ink)}button{cursor:pointer}button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.toolbar button{margin-left:auto}.facts{display:grid;grid-template-columns:repeat(4,1fr);border-block:1px solid var(--line);margin:24px 0}.facts>div{padding:18px 8px;border-right:1px solid var(--line)}.facts>div:last-child{border:0}.facts dt{font-size:13px;color:var(--muted)}.facts dd{margin:6px 0 0;font-size:clamp(19px,2.7vw,26px);font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}.box{border-left:3px solid var(--accent);background:#f5f2eb;padding:14px 18px;margin:18px 0}.chart{width:100%;height:auto;display:block}.chart text{font-family:inherit;fill:#4b5d70;font-size:12px}.chart rect:hover{opacity:.65}.legend{display:flex;gap:18px;font-size:13px}.legend span:before{content:'';display:inline-block;width:10px;height:10px;background:var(--c);margin-right:6px}.table-scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px;margin:16px 0}caption{text-align:left;font-weight:700}th,td{text-align:right;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}th{background:#eef0ef;color:var(--ink)}td:first-child,th:first-child{text-align:left}th button{padding:2px;border:0;background:transparent;font-size:14px}details{border-bottom:1px solid var(--line);padding:12px 0}summary{cursor:pointer;color:var(--ink);font-weight:700}.warning{color:#8c4e25}.month-note{font-weight:600;color:var(--accent)}.bars{display:grid;gap:10px}.bar-row{display:grid;grid-template-columns:minmax(130px,1fr) 2fr minmax(110px,1fr);gap:10px;align-items:center;font-size:14px}.bar-track{background:#e9eced;height:12px}.bar-fill{height:12px;background:#3b7dd8}.bar-value{text-align:right;font-variant-numeric:tabular-nums}footer{margin-top:40px;border-top:1px solid var(--line);padding-top:16px;font-size:12px;color:var(--muted);overflow-wrap:anywhere}@media(max-width:600px){body{font-size:15px}main{margin:0;padding:20px 16px}.facts{grid-template-columns:repeat(2,1fr)}.facts>div:nth-child(2){border:0}.bar-row{grid-template-columns:110px 1fr 105px;gap:6px;font-size:12px}.toolbar{font-size:14px}.toolbar button{margin-left:0}h2{font-size:22px}}
@page{size:A4;margin:15mm}@media print{body{background:white;font-size:10pt}main{max-width:none;margin:0;padding:0}.toolbar,.screen-only{display:none!important}h1{font-size:30pt}h2{font-size:16pt;break-before:page}section:first-of-type h2{break-before:auto}.facts dd{font-size:16pt}.box,svg,tr{break-inside:avoid}details>summary{list-style:none}details{break-inside:auto}.table-scroll{overflow:visible}table{font-size:8pt}th,td{white-space:normal;padding:5px}.bar-row{font-size:9pt}.chart{max-height:75mm}.facts{grid-template-columns:repeat(4,1fr)}.caption,footer{font-size:8pt}thead{display:table-header-group}}
</style><main><div class="eyebrow">솜니움기독교정치사회연구소 · 재정 보고</div><h1>2026년 1~9월<br>재정보고서</h1><p class="lead">들어온 돈과 쓰인 돈, 후원 구조와 월별 흐름을 함께 살펴봅니다.</p><p class="month-note" id="pending"></p><div class="toolbar"><label for="month">보고 기간</label><select id="month"><option value="0">1~9월 누계</option></select><button id="print" type="button">인쇄 · PDF 저장</button></div><div id="report"></div><footer id="sources"></footer></main>
<script id="report-data" type="application/json">REPORT_JSON</script><script>
'use strict';const D=JSON.parse(document.getElementById('report-data').textContent);let selected=0,sort={key:'date',direction:1};const $=id=>document.getElementById(id),money=n=>n.toLocaleString('ko-KR')+'원',esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),sum=a=>a.reduce((a,b)=>a+b,0),months=()=>selected?[selected]:D.monthly.map(m=>m.month),val=a=>sum(months().map(m=>a[m-1])),account=n=>val(D.accounts.find(a=>a.name===n)?.values||D.monthly.map(()=>0)),total=k=>sum(D.monthly.filter(m=>months().includes(m.month)).map(m=>m[k])),period=()=>selected?selected+'월':'1~'+D.through+'월',pct=(n,d)=>d?(n/d*100).toFixed(1)+'%':'계산 불가',sec=(n,title,body)=>`<section><h2>${n}. ${title}</h2>${body}</section>`,table=(headers,rows)=>`<div class="table-scroll"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
function bars(items){let max=Math.max(...items.map(i=>i[1]),1);return `<div class="bars">${items.map(([n,v])=>`<div class="bar-row" title="${esc(n)} ${money(v)}"><span>${esc(n)}</span><div class="bar-track"><div class="bar-fill" style="width:${v/max*100}%"></div></div><span class="bar-value">${money(v)}</span></div>`).join('')}</div>`}
function chart(){const ms=D.monthly.filter(m=>months().includes(m.month)),W=760,H=250,step=680/ms.length,max=Math.max(...ms.flatMap(m=>[m.income,m.expense]),1);return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="월별 수입과 지출"><line x1="45" y1="208" x2="740" y2="208" stroke="#aab6bf"/>${ms.map((m,i)=>{const x=55+i*step,bw=Math.min(24,step/3);return ['income','expense'].map((k,j)=>{const h=m[k]/max*170;return `<rect tabindex="0" x="${x+j*(bw+3)}" y="${208-h}" width="${bw}" height="${h}" fill="${j?'#c36b4f':'#3b7dd8'}"><title>${m.month}월 ${j?'지출':'수입'} ${money(m[k])}</title></rect>`}).join('')+`<text x="${x+15}" y="230" text-anchor="middle">${m.month}월</text>`}).join('')}</svg><div class="legend"><span style="--c:#3b7dd8">수입</span><span style="--c:#c36b4f">지출</span></div><p class="caption">막대에 마우스를 올리면 금액이 보입니다. 정확한 수치는 아래 월별 표에서도 확인할 수 있습니다.</p>`}
function render(){const inc=total('income'),exp=total('expense'),net=inc-exp,chosen=D.monthly.filter(m=>months().includes(m.month)),last=chosen.at(-1),opening=selected?(selected===1?D.opening:D.monthly[selected-2].balance):D.opening;const donationNames=['정기후원금','일시후원금','한빛누리CMS후원금','한빛누리비CMS후원금'],donations=sum(donationNames.map(account)),priorKeys=['정기후원','일시후원','한빛누리CMS','한빛누리 비CMS'],prior=sum(priorKeys.map(k=>D.previous[k]?val(D.previous[k]):0));
let out=sec(1,'한눈에 보기',`<p>${period()} 동안 들어오고 나간 돈의 요약입니다.</p><dl class="facts"><div><dt>수입</dt><dd>${money(inc)}</dd></div><div><dt>지출</dt><dd>${money(exp)}</dd></div><div><dt>수지</dt><dd>${money(net)}</dd></div><div><dt>${last.month}월 말 잔액</dt><dd>${money(last.balance)}</dd></div></dl><p>${period()}에 ${money(inc)}이 들어왔고 ${money(exp)}을 썼습니다. 수입과 지출의 차이는 ${money(net)}입니다. 기간 시작 잔액 ${money(opening)}에 이 차액을 더하면 ${last.month}월 말 통장 잔액 ${money(last.balance)}과 일치합니다.</p><div class="box">차입금 ${money(account('차입금'))}은 후원·사업 수입과 구분합니다. 한빛누리 후원은 수수료 차감 전 총액이며, 수수료는 같은 금액을 지출에 반영합니다.</div>`);
out+=sec(2,'후원, 작년 같은 기간과 비교하면',`<p>계좌 직접 후원과 한빛누리 후원을 합쳐 같은 달끼리 비교했습니다.</p>${prior?`<p>2025년 ${period()} 후원은 ${money(prior)}, 2026년 같은 기간은 ${money(donations)}입니다. 차이는 ${money(donations-prior)}(${pct(donations-prior,prior)})입니다.</p>`:'<p>작년 같은 기간의 비교 자료가 없어 증감은 계산하지 않았습니다.</p>'}${table(['후원 경로','2025년','2026년'],donationNames.map((n,i)=>[esc(n),D.previous[priorKeys[i]]?money(val(D.previous[priorKeys[i]])):'자료 없음',money(account(n))]))}<p class="caption">2025년은 후원현황 원본의 월별 합계, 2026년은 마감 워크북의 총액 기준입니다. 수입 전체의 증감이나 후원자 수의 변화로 확대 해석하지 않습니다.</p>`);
out+=sec(3,'한빛누리 후원 구조',`<p>한빛누리를 통한 CMS와 비CMS 후원을 구분했습니다.</p>${bars(['한빛누리CMS후원금','한빛누리비CMS후원금','정기후원금','일시후원금'].map(n=>[n,account(n)]))}<div class="box">후원금 총액과 통장 실입금은 집금·결제 수수료만큼 다릅니다. 세부 결제 채널이나 신규·중단 인원은 이 보고서에서 추정하지 않습니다.</div>`);
out+=sec(4,'수입은 어디서 왔나',`<p>${period()} 수입을 계정별로 나눠 봅니다.</p>${bars(D.accounts.filter(a=>a.side==='income'&&val(a.values)!==0).map(a=>[a.name,val(a.values)]).sort((a,b)=>b[1]-a[1]))}<p>한빛누리 비CMS 후원은 전체 수입의 ${pct(account('한빛누리비CMS후원금'),inc)}, 장소대여료는 ${pct(account('장소대여료'),inc)}입니다. 차입금은 후원이 아니므로 지속적인 운영 재원으로 보지 않습니다.</p>`);
const groups=['경상비','사업비','퇴직금','기타지출'].map(g=>[g,sum(D.accounts.filter(a=>a.side==='expense'&&a.group===g).map(a=>val(a.values)))]);
out+=sec(5,'돈은 어디에 쓰였나',`<p>연구소 유지에 드는 경상비와 사업 활동비, 그 밖의 지출을 구분했습니다.</p>${bars(groups)}<p>급여 ${money(account('급여'))}과 사무실 임차료 ${money(account('사무실임차료'))}을 합하면 전체 지출의 ${pct(account('급여')+account('사무실임차료'),exp)}입니다. 사무실 임차료와 장소대여료 수입은 서로 상계하지 않고 각각 표시합니다.</p>${groups.map(([g,v])=>`<details><summary>${g} · ${money(v)} — 세부 계정 펼치기</summary>${table(['계정','금액'],D.accounts.filter(a=>a.side==='expense'&&a.group===g).map(a=>[esc(a.name),money(val(a.values))]))}</details>`).join('')}${(!selected||selected===8)?'<div class="box">8월 사업비가 늘어난 주된 이유는 세미나 강사료 지급이 한 달에 모였기 때문입니다. 지급 대상 역할·단가·일부 지급 여부는 확인 대기이며, 확정 전에는 장부를 바꾸지 않았습니다.</div>':''}`);
out+=sec(6,'월별 흐름',`<p>월별 수입·지출과 통장 잔액을 함께 봅니다.</p>${chart()}${table(['월','수입','지출','수지','월말 잔액'],chosen.map(m=>[m.month+'월',money(m.income),money(m.expense),money(m.net),money(m.balance)]))}<p class="caption">모든 표시 월의 통장 검증값은 0입니다. 월말 잔액은 기간 수지와 같은 뜻이 아닙니다.</p>`);
const monthsCount=chosen.length,steady=account('한빛누리비CMS후원금')+account('한빛누리CMS후원금')+account('장소대여료'),baseExpense=account('급여')+account('사무실임차료')+account('사무비')+account('CMS비용');
out+=sec(7,'고정과 변동, 예산의 뼈대',`<p>고정성 항목의 실적 평균과 상황에 따라 달라지는 사업비를 나눠 봅니다.</p>${table(['구분','기간 합계','월평균'],[['한빛누리 후원 + 장소대여료',money(steady),money(Math.round(steady/monthsCount))],['급여 + 임차료 + 사무비 + CMS비용',money(baseExpense),money(Math.round(baseExpense/monthsCount))],['두 묶음의 차이',money(steady-baseExpense),money(Math.round((steady-baseExpense)/monthsCount))]])}<div class="box">위 금액은 이 기간 실적의 평균입니다. 후원·대여료가 앞으로 보장된다는 뜻이나 확정 예산이 아닙니다. 강사비·연구지원·홍보 등 사업비와 기타 지출도 별도로 필요합니다.</div>`);
let ts=D.transactions.filter(t=>months().includes(t.month));ts.sort((a,b)=>sort.direction*(typeof a[sort.key]==='number'?a[sort.key]-b[sort.key]:String(a[sort.key]).localeCompare(String(b[sort.key]),'ko')));
out+=sec(8,'상세 내역과 참고',`<details id="account-detail"><summary>계정별 결산 펼치기</summary>${table(['구분','계정',...chosen.map(m=>m.month+'월'),'선택 기간 합계'],D.accounts.map(a=>[a.side==='income'?'수입':'지출',esc(a.name),...chosen.map(m=>money(a.values[m.month-1])),money(val(a.values))]))}</details><details id="transaction-detail"><summary>월별 통장 거래 ${ts.length}건 펼치기</summary><p class="caption">개인 이름은 마스킹하고 계좌번호·연락처·통장 메모는 제외했습니다. 여기는 통장 실입출금 기준이므로 수수료를 포함한 총액 기준의 계정별 금액과 다를 수 있습니다. 차액은 총액 환산 조정이며 순수지는 동일합니다.</p>${table(['date','account','name','income','expense'].map(k=>`<button data-sort="${k}" type="button">${{date:'날짜',account:'계정',name:'보낸 분·받는 분',income:'입금',expense:'출금'}[k]} ↕</button>`),ts.map(t=>[esc(t.date),esc(t.account),esc(t.name),money(t.income),money(t.expense)]))}</details><details><summary>확인 대기 3건</summary><ul>${D.questions.map(q=>`<li>${esc(q)}</li>`).join('')}</ul><p>확인 요청은 미분류나 오지급의 확정이 아닙니다. 역할·지급 기준을 확인한 뒤 필요한 경우 이력을 남겨 정정합니다.</p></details><div class="box">미마감 월의 수치는 넣지 않았습니다. ${esc(D.pending)}. 이 보고서는 관리자 검토용 초안이며, 게시 전에는 일반 회원에게 보이지 않습니다.</div>`);
const open=[...document.querySelectorAll('details[open][id]')].map(e=>e.id);$('report').innerHTML=out;for(const id of open)if($(id))$(id).open=true;for(const b of document.querySelectorAll('[data-sort]'))b.onclick=()=>{sort={key:b.dataset.sort,direction:sort.key===b.dataset.sort?-sort.direction:1};render()};}
for(const m of D.monthly){let o=document.createElement('option');o.value=m.month;o.textContent=m.month+'월';$('month').append(o)}$('month').onchange=e=>{selected=Number(e.target.value);render()};document.querySelector('h1').textContent=D.year+'년 1~'+D.through+'월 재정보고서';$('month').options[0].textContent='1~'+D.through+'월 누계';$('pending').textContent=D.pending;$('sources').textContent='자료: 솜니움 2026년 마감 워크북(읽기 전용 재계산 사본), 2025년 후원현황. 모든 금액은 원 단위. 개인 이름은 마스킹했습니다. 자료 지문: '+D.source_sha256;let beforePrint=[];window.addEventListener('beforeprint',()=>{beforePrint=[...document.querySelectorAll('details')].map(e=>[e,e.open]);for(const[e]of beforePrint)e.open=true});window.addEventListener('afterprint',()=>{for(const[e,open]of beforePrint)e.open=open});$('print').onclick=()=>window.print();render();
</script></html>
