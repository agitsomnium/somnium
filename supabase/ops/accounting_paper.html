<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="REPORT_CSP"><title>솜니움 재정보고서</title><style>
:root{--ink:#203b5e;--accent:#bd6d2c;--muted:#647384;--paper:#fffdfa;--line:#deded6;--prov:#8c4e25;--provbg:#fff1df}*{box-sizing:border-box}body{margin:0;background:#f0ede6;color:#25313e;font:16px/1.75 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}main{max-width:980px;margin:24px auto;background:var(--paper);padding:clamp(20px,5vw,60px)}h1,h2,h3{color:var(--ink);line-height:1.4}h1{font-size:clamp(28px,5vw,46px);margin:.4em 0}h2{font-size:25px;border-top:2px solid var(--ink);padding-top:18px;margin-top:42px}h3{font-size:18px}.eyebrow{color:var(--accent);font-weight:700;letter-spacing:.05em}.lead,.caption{color:var(--muted)}.caption{font-size:13px}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 0;border-block:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:2}button,select{font:inherit;background:#fff;border:1px solid #b7b8b5;border-radius:5px;padding:7px 12px;color:var(--ink)}button{cursor:pointer}button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.toolbar button{margin-left:auto}
.facts{display:grid;grid-template-columns:repeat(4,1fr);border-block:1px solid var(--line);margin:24px 0}.facts>div{padding:18px 8px;border-right:1px solid var(--line)}.facts>div:last-child{border:0}.facts dt{font-size:13px;color:var(--muted)}.facts dd{margin:6px 0 0;font-size:clamp(19px,2.7vw,26px);font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.box{border-left:3px solid var(--accent);background:#f5f2eb;padding:14px 18px;margin:18px 0}.prov-banner{border:2px solid var(--prov);background:var(--provbg);color:#5d3416;padding:14px 18px;margin:18px 0;font-weight:600}.prov-banner p{margin:.3em 0}.badge{display:inline-block;font-size:12px;font-weight:700;line-height:1.5;padding:0 8px;border-radius:99px;border:1px solid var(--prov);background:var(--provbg);color:var(--prov);vertical-align:middle;white-space:nowrap}.badge.ok{border-color:#2d6a4f;background:#e6f2ea;color:#2d6a4f}tr.prov td{background:var(--provbg)}
.chart{width:100%;height:auto;display:block}.chart text{font-family:inherit;fill:#4b5d70;font-size:12px}.chart .val{font-size:10px;fill:#25313e}.chart rect:hover{opacity:.65}.legend{display:flex;gap:18px;font-size:13px;flex-wrap:wrap}.legend span:before{content:'';display:inline-block;width:10px;height:10px;background:var(--c);margin-right:6px}
.table-scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px;margin:16px 0}caption{text-align:left;font-weight:700}th,td{text-align:right;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}th{background:#eef0ef;color:var(--ink)}td:first-child,th:first-child{text-align:left}th button{padding:2px;border:0;background:transparent;font-size:14px}tr.total td{font-weight:700;border-top:1px solid var(--ink)}tr.grp td{background:#eef0ef;color:var(--ink);padding:6px 10px}
details{border-bottom:1px solid var(--line);padding:12px 0}summary{cursor:pointer;color:var(--ink);font-weight:700}.month-note{font-weight:600;color:var(--accent)}.bars{display:grid;gap:10px}.bar-row{display:grid;grid-template-columns:minmax(130px,1fr) 2fr minmax(110px,1fr);gap:10px;align-items:center;font-size:14px}.bar-track{background:#e9eced;height:12px}.bar-fill{height:12px;background:#3b7dd8}.bar-value{text-align:right;font-variant-numeric:tabular-nums}
.cover{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 20px;font-size:14px;border:1px solid var(--line);padding:12px 16px;margin:18px 0}.cover b{color:var(--ink)}footer{margin-top:40px;border-top:1px solid var(--line);padding-top:16px;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
@media(max-width:600px){body{font-size:15px}main{margin:0;padding:20px 16px}.facts{grid-template-columns:repeat(2,1fr)}.facts>div:nth-child(2){border:0}.cover{grid-template-columns:1fr}.bar-row{grid-template-columns:110px 1fr 105px;gap:6px;font-size:12px}.toolbar{font-size:14px}.toolbar button{margin-left:0}h2{font-size:22px}}
@page{size:A4;margin:15mm 14mm 18mm;@bottom-center{content:"솜니움 재정보고서 · " counter(page) " / " counter(pages);font-size:8pt;color:#647384}}
@media print{body{background:white;font-size:10pt}main{max-width:none;margin:0;padding:0}.toolbar,.screen-only{display:none!important}h1{font-size:28pt}h2{font-size:15pt;margin-top:22px;break-after:avoid}section.pb{break-before:page}.facts dd{font-size:15pt}.box,.prov-banner,svg,tr,.bars,.cover{break-inside:avoid}details>summary{list-style:none}details{break-inside:auto}.table-scroll{overflow:visible}table{font-size:8pt;margin:10px 0}th,td{white-space:normal;padding:4px}.bar-row{font-size:9pt}.chart{max-height:80mm}.facts{grid-template-columns:repeat(4,1fr)}.caption,footer{font-size:8pt}thead{display:table-header-group}table.nw{font-size:7.5pt}table.nw th,table.nw td{white-space:nowrap;padding:3px 4px}}
</style><main><div class="eyebrow">솜니움기독교정치사회연구소 · 재정 보고</div><h1 id="title">2026년 재정보고서</h1><p class="lead">들어온 돈과 쓰인 돈, 후원 구조와 월별 흐름을 함께 살펴봅니다.</p><div class="cover" id="cover"></div><p class="month-note" id="pending"></p><div class="toolbar"><label for="month">보고 기간</label><select id="month"></select><button id="print" type="button">인쇄 · PDF 저장</button></div><div id="report"></div><footer id="sources"></footer></main>
<script id="report-data" type="application/json">REPORT_JSON</script><script>
'use strict';
const D=JSON.parse(document.getElementById('report-data').textContent);
let view='conf',sort={key:'date',direction:1};
const $=id=>document.getElementById(id),money=n=>n.toLocaleString('ko-KR')+'원',num=n=>n.toLocaleString('ko-KR'),
esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
sum=a=>a.reduce((x,y)=>x+y,0),pct=(n,d)=>d?(n/d*100).toFixed(1)+'%':'계산 불가',
sec=(n,title,body,cls)=>`<section${cls?` class="${cls}"`:''}><h2>${n}. ${title}</h2>${body}</section>`,
table=(headers,rows,opts={})=>`<div class="table-scroll"><table${opts.nw?' class="nw"':''}><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map((r,i)=>`<tr${(opts.cls&&opts.cls[i])?` class="${opts.cls[i]}"`:''}>${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`,
byMonth=Object.fromEntries(D.monthly.map(m=>[m.month,m])),
confirmed=D.monthly.filter(m=>m.status==='확정'&&m.month<=D.confirmed_through).map(m=>m.month),
provisional=D.monthly.filter(m=>m.status==='잠정').map(m=>m.month),
months=()=>typeof view==='number'?[view]:view==='all'?D.monthly.map(m=>m.month):(confirmed.length?confirmed:D.monthly.map(m=>m.month)),
hasProv=()=>months().some(m=>byMonth[m].status==='잠정'),
val=a=>sum(months().map(m=>a[m-1])),
account=n=>val(D.accounts.find(a=>a.name===n)?.values||D.monthly.map(()=>0)),
total=k=>sum(months().map(m=>byMonth[m][k])),
span=ms=>ms.length===1?ms[0]+'월':ms[0]+'~'+ms.at(-1)+'월',
period=()=>typeof view==='number'?view+'월'+(byMonth[view].status==='잠정'?' (잠정)':''):view==='all'&&provisional.length?span(months())+' (잠정 포함)':span(months()),
badge=m=>byMonth[m].status==='잠정'?'<span class="badge">잠정</span>':'<span class="badge ok">확정</span>';

function bars(items){const max=Math.max(...items.map(i=>i[1]),1);return `<div class="bars">${items.map(([n,v])=>`<div class="bar-row" title="${esc(n)} ${money(v)}"><span>${esc(n)}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.max(v,0)/max*100}%"></div></div><span class="bar-value">${money(v)}</span></div>`).join('')}</div>`}

function chart(){
  const ms=months().map(m=>byMonth[m]),W=760,H=300,top=70,base=262,ph=base-top,step=680/ms.length,max=Math.max(...ms.flatMap(m=>[m.income,m.expense]),1);
  const bw=Math.min(26,step/2.6);
  const bar=(m,x,k,j)=>{const h=m[k]/max*ph,prov=m.status==='잠정',color=j?'#c36b4f':'#3b7dd8',fill=prov?`url(#h${j})`:color,label=num(m[k]),cx=x+j*(bw+3)+bw/2;
    return `<rect tabindex="0" x="${x+j*(bw+3)}" y="${base-h}" width="${bw}" height="${h}" fill="${fill}" stroke="${color}" stroke-width="${prov?1.5:0}"><title>${m.month}월${prov?' (잠정)':''} ${j?'지출':'수입'} ${money(m[k])}</title></rect><text class="val" transform="translate(${cx+3.5},${base-h-4}) rotate(-90)">${label}</text>`};
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="월별 수입과 지출"><defs><pattern id="h0" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff"/><rect width="3" height="6" fill="#3b7dd8"/></pattern><pattern id="h1" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff"/><rect width="3" height="6" fill="#c36b4f"/></pattern></defs><line x1="45" y1="${base}" x2="745" y2="${base}" stroke="#aab6bf"/>${ms.map((m,i)=>{const x=55+i*step;return bar(m,x,'income',0)+bar(m,x,'expense',1)+`<text x="${x+bw+1.5}" y="${base+18}" text-anchor="middle">${m.month}월</text>${m.status==='잠정'?`<text x="${x+bw+1.5}" y="${base+33}" text-anchor="middle" style="fill:#8c4e25;font-weight:700">잠정</text>`:''}`}).join('')}</svg><div class="legend"><span style="--c:#3b7dd8">수입</span><span style="--c:#c36b4f">지출</span>${hasProv()?'<span style="--c:#fff1df;outline:1px solid #8c4e25">빗금 막대 = 잠정 월</span>':''}</div><p class="caption">막대 위에 금액(원)을 적었고, 마우스를 올리면 월과 구분이 함께 보입니다.</p>`}

/* 고정/변동은 선택 기간의 월별 값만으로 정한 참고용 자동 판별: 매달 발생하고 편차가 평균의 25% 이하면 고정. */
function nature(a){const vs=months().map(m=>a.values[m-1]);if(vs.length<3||!sum(vs))return '—';const mean=sum(vs)/vs.length;return vs.every(v=>v>0)&&(Math.max(...vs)-Math.min(...vs))/mean<=0.25?'고정':'변동'}

function render(){
  const ms=months(),chosen=ms.map(m=>byMonth[m]),inc=total('income'),exp=total('expense'),net=inc-exp,last=chosen.at(-1),first=chosen[0],
    opening=first.month===1?D.opening:byMonth[first.month-1].balance,prov=hasProv(),
    donationNames=['정기후원금','일시후원금','한빛누리CMS후원금','한빛누리비CMS후원금'],priorKeys=['정기후원','일시후원','한빛누리CMS','한빛누리 비CMS'],
    donations=sum(donationNames.map(account)),priorVal=k=>D.previous[k]?val(D.previous[k]):null,prior=sum(priorKeys.map(k=>priorVal(k)||0)),
    exAccts=D.accounts.filter(a=>a.side==='expense'),inAccts=D.accounts.filter(a=>a.side==='income');
  const tag=prov?' (잠정 포함)':'';
  let out='',sn=0;const S=(t,b,c)=>sec(++sn,t,b,c);
  if(prov){const pm=chosen.filter(m=>m.status==='잠정'),cf=chosen.filter(m=>m.status==='확정'),s=(l,k)=>sum(l.map(m=>m[k]));
    out+=`<div class="prov-banner"><p>⚠ 이 화면에는 <b>잠정 마감 월(${pm.map(m=>m.month+'월').join('·')})</b>이 들어 있습니다.</p><p>잠정은 통장 입금액과 추정치로 정리한 값이며, 한빛누리 원본 자료와 대조하기 전입니다. 확정된 달의 합계와 섞이지 않도록 아래에 따로 적었습니다.</p>${cf.length&&typeof view!=='number'?table(['구분','수입','지출','수지'],[[`확정 ${span(cf.map(m=>m.month))}`,money(s(cf,'income')),money(s(cf,'expense')),money(s(cf,'income')-s(cf,'expense'))],[`잠정 ${span(pm.map(m=>m.month))}`,money(s(pm,'income')),money(s(pm,'expense')),money(s(pm,'income')-s(pm,'expense'))],['합계 (잠정 포함)',money(inc),money(exp),money(net)]],{cls:['','prov','total']}):''}</div>`}
  out+=S('한눈에 보기',`<p>${period()} 동안 들어오고 나간 돈의 요약입니다.</p><dl class="facts"><div><dt>수입${tag}</dt><dd>${money(inc)}</dd></div><div><dt>지출${tag}</dt><dd>${money(exp)}</dd></div><div><dt>수지${tag}</dt><dd>${money(net)}</dd></div><div><dt>${last.month}월 말 잔액${last.status==='잠정'?' (잠정)':''}</dt><dd>${money(last.balance)}</dd></div></dl><p>${period()}에 ${money(inc)}이 들어왔고 ${money(exp)}을 썼습니다. 수입과 지출의 차이는 ${money(net)}입니다. 기간 시작 잔액 ${money(opening)}에 이 차액을 더하면 ${last.month}월 말 통장 잔액 ${money(last.balance)}과 일치합니다.</p><div class="box">차입금 ${money(account('차입금'))}은 후원·사업 수입과 구분합니다. 한빛누리 후원은 수수료 차감 전 총액이며, 수수료는 같은 금액을 지출에 반영합니다.</div>`);
  out+=S('후원, 작년 같은 기간과 비교하면',`<p>계좌 직접 후원과 한빛누리 후원을 합쳐 같은 달끼리 비교했습니다.</p>${prior?`<p>2025년 ${period()} 후원은 ${money(prior)}, 2026년 같은 기간은 ${money(donations)}입니다. 차이는 ${money(donations-prior)}(${pct(donations-prior,prior)})입니다.</p>`:'<p>작년 같은 기간의 비교 자료가 없어 증감은 계산하지 않았습니다.</p>'}${table(['후원 경로','2025년','2026년','증감'],donationNames.map((n,i)=>{const p=priorVal(priorKeys[i]);return [esc(n),p===null?'자료 없음':money(p),money(account(n)),p===null?'—':money(account(n)-p)]}))}<p class="caption">2025년은 후원현황 원본의 월별 합계, 2026년은 마감 워크북의 총액 기준입니다. 수입 전체의 증감이나 후원자 수의 변화로 확대 해석하지 않습니다.</p>`);
  out+=S('한빛누리 후원 구조',`<p>한빛누리를 통한 CMS와 비CMS 후원을 구분했습니다.</p>${bars(['한빛누리CMS후원금','한빛누리비CMS후원금','정기후원금','일시후원금'].map(n=>[n,account(n)]))}<div class="box">후원금 총액과 통장 실입금은 집금·결제 수수료만큼 다릅니다. 세부 결제 채널이나 신규·중단 인원은 이 보고서에서 추정하지 않습니다.</div>`);
  /* 후원자별 납부(가린 이름): 선택 기간에 납부가 있는 사람만, 분류별로. 한 분류가 1~2명이면 이름 없이 합계만. */
  const catTitle={'정기후원금':'정기후원','일시후원금':'일시후원','한빛누리CMS후원금':'한빛누리 CMS','한빛누리비CMS후원금':'한빛누리 비CMS'},nz0=v=>v?num(v):'-';
  const ds=(D.donors||[]).map(d=>({...d,total:val(d.values)})).filter(d=>d.total);
  const dcats=[...new Set(ds.map(d=>d.category))],mism=Object.entries(D.donor_check||{}).map(([c,m])=>[c,m.filter(x=>ms.includes(x))]).filter(([c,m])=>m.length);
  const donorBlock=dcats.map(c=>{const l=ds.filter(d=>d.category===c).sort((a,b)=>b.total-a.total),t=sum(l.map(d=>d.total));
    return l.length<=2?`<details><summary>${esc(catTitle[c]||c)} · ${l.length}명 · ${money(t)}</summary><p>해당 인원이 ${l.length}명뿐이라 이름과 개별 금액은 적지 않고 합계만 보입니다.</p></details>`
      :`<details><summary>${esc(catTitle[c]||c)} · ${l.length}명 · ${money(t)} — 펼치기</summary>${table(['후원자',...chosen.map(m=>m.month+'월'+(m.status==='잠정'?'<br>(잠정)':'')),'합계'],l.map(d=>[esc(d.name),...chosen.map(m=>nz0(d.values[m.month-1])),num(d.total)]),{nw:true})}</details>`}).join('');
  const cc=D.cms_change;let cmsBlock='';
  if(cc){const nw=cc.new,st=cc.stopped;
    cmsBlock=`<h3>한빛누리 CMS 후원자 변동</h3><dl class="facts"><div><dt>신규</dt><dd>${nw.length}명</dd></div><div><dt>중단 표시</dt><dd>${st.length}명</dd></div><div><dt>월 정기수입 증감</dt><dd>${cc.monthly_delta>0?'+':''}${money(cc.monthly_delta)}</dd></div><div><dt>신규 약정 월액</dt><dd>${money(sum(nw.map(x=>x.monthly)))}</dd></div></dl>
    <p>신규는 2026년에 CMS를 시작한 후원자, 중단은 2025년에 CMS 납부가 있었으나 2026년에는 없는 후원자입니다. 월 정기수입 증감은 신규 약정 월액에서 중단자의 2025년 마지막 월 납부액을 뺀 값입니다. 완전 중단인지 일시 중단인지는 확인하지 않았습니다.</p>
    ${st.length>=3?table(['중단 표시 후원자','2025년 마지막 월 납부액'],st.map(x=>[esc(x.name),x.last2025==null?'자료 없음':money(x.last2025)])):`<p class="caption">중단 ${st.length}명은 인원이 적어 이름 없이 집계만 적었습니다.</p>`}
    ${nw.length<=2?`<p class="caption">신규 ${nw.length}명은 인원이 적어 이름 없이 집계만 적었습니다.</p>`:table(['신규 후원자','약정 월액'],nw.map(x=>[esc(x.name),money(x.monthly)]))}`}
  out+=S('후원자별 납부와 변동 (이름은 가림)',`<p>후원자 이름은 성과 끝 글자만 남기고 가렸습니다(예: 김*환). 서로 다른 사람의 가린 이름이 같을 수 있습니다. 분류별 인원이 1~2명이면 합계만 적습니다.</p>${donorBlock||'<p>선택한 기간에 납부 자료가 없습니다.</p>'}${mism.length?`<div class="box">사람별 명세의 합계가 장부 월 합계와 다른 달이 있습니다: ${mism.map(([c,m])=>(catTitle[c]||c)+' '+m.join('·')+'월').join(', ')}. 한빛누리 사람별 명세가 아직 반영되지 않았거나 기준이 달라서이며, 그 달의 사람별 금액과 «납부 없음» 표시는 참고용입니다. 장부 합계(수입 계정)는 위 값이 기준입니다.</div>`:''}${cmsBlock}`);
  out+=S('수입은 어디서 왔나',`<p>${period()} 수입을 계정별로 나눠 봅니다.</p>${bars(inAccts.filter(a=>val(a.values)!==0).map(a=>[a.name,val(a.values)]).sort((a,b)=>b[1]-a[1]))}<p>한빛누리 비CMS 후원은 전체 수입의 ${pct(account('한빛누리비CMS후원금'),inc)}, 장소대여료는 ${pct(account('장소대여료'),inc)}입니다. 차입금은 후원이 아니므로 지속적인 운영 재원으로 보지 않습니다.</p>`);
  const groups=['경상비','사업비','퇴직금','기타지출'].map(g=>[g,sum(exAccts.filter(a=>a.group===g).map(a=>val(a.values)))]);
  const notes=(D.notes||[]).filter(n=>n.months.some(m=>ms.includes(m)));
  out+=S('돈은 어디에 쓰였나',`<p>연구소 유지에 드는 경상비와 사업 활동비, 그 밖의 지출을 구분했습니다.</p>${bars(groups)}<p>급여 ${money(account('급여'))}과 사무실 임차료 ${money(account('사무실임차료'))}을 합하면 전체 지출의 ${pct(account('급여')+account('사무실임차료'),exp)}입니다. 사무실 임차료와 장소대여료 수입은 서로 상계하지 않고 각각 표시합니다.</p>${groups.map(([g,v])=>`<details><summary>${g} · ${money(v)} — 세부 계정 펼치기</summary>${table(['계정','금액'],exAccts.filter(a=>a.group===g).map(a=>[esc(a.name),money(val(a.values))]))}</details>`).join('')}${notes.map(n=>`<div class="box">${esc(n.text)}</div>`).join('')}`);
  const px=D.proxy;
  if(px){const pr=px.rows.filter(r=>ms.includes(r.month)),cnt=pr.filter(r=>r.status!=='상계 제외'),offs=pr.filter(r=>r.status==='상계 제외'),amt=sum(cnt.map(r=>r.amount));
    const accts=[...new Set(cnt.map(r=>r.account))].map(a=>{const l=cnt.filter(r=>r.account===a);return {a,l,n:l.length,v:sum(l.map(r=>r.amount)),p:new Set(l.map(r=>r.pid)).size}}).sort((x,y)=>y.v-x.v);
    const flagged=pr.filter(r=>r.rule==='배달 표시 없음');
    out+=S('대표·간사 계좌 대납 경비',`<p class="month-note">${esc(px.rule)}</p><p>연구소 통장에서 대표·간사 개인 계좌로 나간 경비입니다. 모두 통장 원장의 출금 한 줄과 1:1로 맞았고, 지출에 한 번만 들어 있습니다(별도 합산 아님).</p><dl class="facts"><div><dt>건수</dt><dd>${cnt.length}건</dd></div><div><dt>금액 (지출 포함)</dt><dd>${money(amt)}</dd></div><div><dt>상계 제외</dt><dd>${offs.length}건 ${money(sum(offs.map(r=>r.amount)))}</dd></div><div><dt>정산 상태</dt><dd style="font-size:15px">사람 정정 ${pr.filter(r=>r.status==='정정 반영').length}건</dd></div></dl>
    ${table(['계정','건수','금액','받은 사람 수'],accts.map(x=>[esc(x.a),x.n+'건',money(x.v),x.p+'명']),{})}
    <p class="caption">정산 상태는 장부 기준입니다: 분류는 자동 ${cnt.filter(r=>r.status==='자동분류').length}건, 사람이 정정한 건 ${cnt.filter(r=>r.status==='정정 반영').length}건이며, 정산 완료 여부는 장부에 따로 적혀 있지 않아 확인 전입니다. 상계 제외는 같은 금액이 나갔다가 되돌아와 지출·수입에 넣지 않은 건입니다.</p>
    ${flagged.length?`<div class="box">10월 이후 대납 중 «배달» 표시가 없는 건이 ${flagged.length}건(${money(sum(flagged.map(r=>r.amount)))}) 있습니다. 장부는 바꾸지 않았고, 확인 대기입니다.</div>`:''}
    <details><summary>건별 내역 펼치기 (이름은 가림)</summary>${accts.map(x=>x.p<=2?`<p><b>${esc(x.a)}</b> · ${x.n}건 ${money(x.v)} — 받은 사람이 ${x.p}명이라 이름 없이 합계만 적습니다.</p>`:`<h3>${esc(x.a)}</h3>${table(['날짜','받은 사람','금액','구분'],x.l.sort((a,b)=>a.date.localeCompare(b.date)).map(r=>[r.date,esc(r.name),money(r.amount),(byMonth[r.month].status==='잠정'?'<span class="badge">잠정</span> ':'')+(r.rule?esc(r.rule):esc(r.status))]),{cls:x.l.map(r=>byMonth[r.month].status==='잠정'?'prov':'')})}`).join('')}</details>`)}
  out+=S('월별 흐름',`<p>월별 수입·지출과 통장 잔액을 함께 봅니다.</p>${chart()}${table(['월','구분','수입','지출','수지','월말 잔액'],chosen.map(m=>[m.month+'월',badge(m.month),money(m.income),money(m.expense),money(m.net),money(m.balance)]),{cls:chosen.map(m=>m.status==='잠정'?'prov':'')})}<p class="caption">모든 표시 월의 통장 검증값은 0입니다. 월말 잔액은 기간 수지와 같은 뜻이 아닙니다.</p>`);
  const n=ms.length,steady=account('한빛누리비CMS후원금')+account('한빛누리CMS후원금')+account('장소대여료'),baseExpense=account('급여')+account('사무실임차료')+account('사무비')+account('CMS비용');
  const nat=D.accounts.filter(a=>val(a.values)&&!['차입금','차입금변제'].includes(a.name)).map(a=>[a.side==='income'?'수입':'지출',esc(a.name),nature(a),money(Math.round(val(a.values)/n)),months().filter(m=>a.values[m-1]).length+' / '+n+'개월']);
  out+=S('고정과 변동, 예산의 뼈대',`<p>고정성 항목의 실적 평균과 상황에 따라 달라지는 사업비를 나눠 봅니다.</p>${table(['구분','기간 합계','월평균'],[['한빛누리 후원 + 장소대여료',money(steady),money(Math.round(steady/n))],['급여 + 임차료 + 사무비 + CMS비용',money(baseExpense),money(Math.round(baseExpense/n))],['두 묶음의 차이',money(steady-baseExpense),money(Math.round((steady-baseExpense)/n))]])}<div class="box">위 금액은 이 기간 실적의 평균입니다. 후원·대여료가 앞으로 보장된다는 뜻이나 확정 예산이 아닙니다. 강사비·연구지원·홍보 등 사업비와 기타 지출도 별도로 필요합니다.</div><details><summary>계정별 고정/변동 판별 (참고) 펼치기</summary>${n>=3?table(['구분','계정','성격(자동)','월평균','발생 월수'],nat):'<p>세 달 이상일 때만 판별합니다.</p>'}<p class="caption">매달 발생하고 월별 편차가 평균의 25% 이하이면 «고정», 그 밖에는 «변동»으로 자동 표시한 참고용 구분이며 확정 예산이 아닙니다. 차입금·차입금변제는 자금 이동이므로 제외했습니다.</p></details>`);
  /* 계정별 결산: 월별 + 분기 + 2025 연간 참고 */
  const nz=n=>n?num(n):'-',head=['계정',...chosen.map(m=>m.month+'월'+(m.status==='잠정'?'<br>(잠정)':'')),'합계'];
  const rows=[],cls=[],addRows=(label,list,tot)=>{rows.push(['<b>'+label+'</b>',...chosen.map(()=>''),'']);cls.push('grp');list.forEach(a=>{rows.push([esc(a.name),...chosen.map(m=>nz(a.values[m.month-1])),nz(val(a.values))]);cls.push('')});rows.push([label+' 합계',...chosen.map(m=>nz(m[tot])),nz(total(tot))]);cls.push('total')};
  addRows('수입',inAccts,'income');addRows('지출',exAccts,'expense');
  const qs=[1,2,3,4].map(q=>({q,ms:ms.filter(m=>Math.ceil(m/3)===q)})).filter(x=>x.ms.length),qv=(a,x)=>sum(x.ms.map(m=>a.values[m-1])),qt=(k,x)=>sum(x.ms.map(m=>byMonth[m][k]));
  const qHead=['계정',...qs.map(x=>x.q+'분기<br>('+span(x.ms)+(x.ms.some(m=>byMonth[m].status==='잠정')?' 잠정 포함':'')+')'),'선택 기간 합계','2025년 연간<br>(참고)'];
  const qRows=[],qCls=[],addQ=(label,list,k)=>{qRows.push(['<b>'+label+'</b>',...qs.map(()=>''),'','']);qCls.push('grp');list.forEach(a=>{qRows.push([esc(a.name),...qs.map(x=>nz(qv(a,x))),nz(val(a.values)),a.prior_year==null?'—':nz(a.prior_year)]);qCls.push('')});qRows.push([label+' 합계',...qs.map(x=>nz(qt(k,x))),nz(total(k)),'—']);qCls.push('total')};
  addQ('수입',inAccts,'income');addQ('지출',exAccts,'expense');
  out+=S('계정별 결산',`<p>월별로 본 계정별 금액입니다(단위: 원, «-»는 0). 한빛누리 후원은 수수료 차감 전 총액 기준입니다.</p>${table(head,rows,{cls,nw:true})}<h3>분기별 요약과 2025년 연간 참고</h3>${table(qHead,qRows,{cls:qCls,nw:true})}<p class="caption">2025년 연간은 지난해 결산보고의 한 해 합계이며, 올해 일부 기간과 직접 비교하지 않습니다. «—»는 해당 자료가 없다는 뜻입니다.</p>`,'pb');
  let ts=D.transactions.filter(t=>ms.includes(t.month));
  const peopleBy={};for(const t of ts){(peopleBy[t.account]??=new Set());if(t.pid)peopleBy[t.account].add(t.pid)}
  const few=a=>peopleBy[a].size<=2,groupedKeys={},merged=[];
  for(const t of ts){if(few(t.account)){const k=t.month+'|'+t.account;if(!groupedKeys[k]){groupedKeys[k]={month:t.month,date:t.month+'월 합계',account:t.account,name:'해당 인원 '+peopleBy[t.account].size+'명(이름 생략)',income:0,expense:0,n:0};merged.push(groupedKeys[k])}const g=groupedKeys[k];g.income+=t.income;g.expense+=t.expense;g.n++}else merged.push(t)}
  ts=merged;
  ts.sort((a,b)=>sort.direction*(typeof a[sort.key]==='number'?a[sort.key]-b[sort.key]:String(a[sort.key]).localeCompare(String(b[sort.key]),'ko')));
  out+=S('상세 내역과 참고',`<details id="transaction-detail"><summary>월별 통장 거래 ${ts.length}줄 펼치기</summary><p class="caption">개인 이름은 성과 끝 글자만 남기고 가렸으며(예: 김*환), 계좌번호·연락처·통장 메모는 제외했습니다. 한 계정에 해당 인원이 1~2명뿐이면 이름 없이 월 합계 한 줄로 묶었습니다. 여기는 통장 실입출금 기준이므로 수수료를 포함한 총액 기준의 계정별 금액과 다를 수 있습니다. 차액은 총액 환산 조정이며 순수지는 동일합니다.</p>${table(['date','account','name','income','expense'].map(k=>`<button data-sort="${k}" type="button">${{date:'날짜',account:'계정',name:'보낸 분·받는 분',income:'입금',expense:'출금'}[k]} ↕</button>`).concat(['구분']),ts.map(t=>[esc(t.date),esc(t.account),esc(t.name),money(t.income),money(t.expense),byMonth[t.month].status==='잠정'?'<span class="badge">잠정</span>':'']),{cls:ts.map(t=>byMonth[t.month].status==='잠정'?'prov':'')})}</details><details id="questions"><summary>확인 대기 ${D.questions.length}건</summary><ul>${D.questions.map(q=>`<li>${esc(q)}</li>`).join('')}</ul><p>확인 요청은 미분류나 오지급의 확정이 아닙니다. 역할·지급 기준을 확인한 뒤 필요한 경우 이력을 남겨 정정합니다.</p></details><div class="box">마감되지 않은 월의 수치는 넣지 않았습니다. ${esc(D.pending)} 이 보고서는 관리자 검토용 초안이며, 게시 전에는 일반 회원에게 보이지 않습니다.</div>`,'pb');
  const open=[...document.querySelectorAll('details[open][id]')].map(e=>e.id);
  $('report').innerHTML=out;for(const id of open)if($(id))$(id).open=true;
  for(const b of document.querySelectorAll('[data-sort]'))b.onclick=()=>{sort={key:b.dataset.sort,direction:sort.key===b.dataset.sort?-sort.direction:1};render()};
}
function setup(){
  const opt=(v,t)=>{const o=document.createElement('option');o.value=v;o.textContent=t;$('month').append(o)};
  if(provisional.length&&confirmed.length){opt('conf','확정 누계 '+span(confirmed));opt('all','잠정 포함 누계 '+span(D.monthly.map(m=>m.month)))}
  else{view='all';opt('all','누계 '+span(D.monthly.map(m=>m.month))+(provisional.length?' (모두 잠정)':''))}
  for(const m of D.monthly)opt(m.month,m.month+'월'+(m.status==='잠정'?' (잠정)':''));
  $('month').onchange=e=>{view=/^\d+$/.test(e.target.value)?Number(e.target.value):e.target.value;render()};
  const c=confirmed.length,t=D.through;
  $('title').innerHTML=D.year+'년 '+(provisional.length?(c?'1~'+D.confirmed_through+'월 확정<br><span style="font-size:.6em;color:var(--prov)">'+(provisional.length===1?provisional[0]+'월':span(provisional)+'월')+' 잠정 포함</span> ':'잠정 ')+'재정보고서':'1~'+t+'월<br>재정보고서');
  $('cover').innerHTML=`<div><b>보고 기간</b> ${D.year}년 1~${t}월</div><div><b>확정</b> ${c?span(confirmed):'없음'}</div><div><b>잠정</b> ${provisional.length?span(provisional):'없음'}</div><div><b>작성일</b> ${esc(D.generated)}</div><div><b>성격</b> 관리자 검토용 초안</div><div><b>금액 단위</b> 원</div>`;
  $('pending').textContent=D.pending;
  $('sources').textContent='자료: 솜니움 '+D.year+'년 마감 워크북(읽기 전용 재계산 사본), 2025년 후원현황. 모든 금액은 원 단위. 개인 이름은 가렸습니다. 자료 지문: '+D.source_sha256;
  let before=[];window.addEventListener('beforeprint',()=>{before=[...document.querySelectorAll('details')].map(e=>[e,e.open]);for(const[e]of before)e.open=true});
  window.addEventListener('afterprint',()=>{for(const[e,o]of before)e.open=o});
  const h=(location.hash.match(/view=(conf|all|\d+)/)||[])[1];if(h&&[...$('month').options].some(o=>o.value===h)){view=/^\d+$/.test(h)?Number(h):h;$('month').value=h}

}
setup();
